{% extends "base.html" %}
{% block title %}Volunteer{% endblock %}
{% block content %}
<div class="page-header">
  <h1>Volunteer for the Library</h1>
  <p>Signing up as <strong>{{ current_member['first_name'] }} {{ current_member['last_name'] }}</strong>. Active members can help shelve books, run events, and support the community.</p>
</div>
<div class="card">
  <form method="post">
    <div class="form-grid single">
      <div class="form-group">
        <label for="availability">Your availability</label>
        <select id="availability" name="availability" required>
          <option value="">Select…</option>
          <option value="Weekday mornings">Weekday mornings</option>
          <option value="Weekday afternoons">Weekday afternoons</option>
          <option value="Weekends">Weekends</option>
          <option value="Flexible">Flexible</option>
        </select>
      </div>
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Sign Up</button>
    </div>
  </form>
</div>
{% endblock %}

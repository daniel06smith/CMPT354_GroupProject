{% extends "base.html" %}
{% block title %}Sign In{% endblock %}
{% block content %}
<div class="page-header">
  <h1>Member Sign In</h1>
  <p>Enter the email address registered with your library account.</p>
</div>

<div class="card" style="max-width:420px;">
  <form method="post">
    <div class="form-grid single">
      <div class="form-group">
        <label for="email">Email address</label>
        <input type="text" id="email" name="email" required
               placeholder="e.g. jane.doe@example.com" autocomplete="email">
      </div>
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Sign In</button>
    </div>
  </form>
</div>

<p style="margin-top:1.25rem;font-size:.82rem;color:var(--ink-soft);">
  No password is required — your email address on file is all you need to sign in.
</p>
{% endblock %}
